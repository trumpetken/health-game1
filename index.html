<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>跳跳跳健康問答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #172313;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
      overscroll-behavior-y: contain; 
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
    }
    .toolbar {
      width: min(1280px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hud, .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.18);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      backdrop-filter: blur(6px);
      transition: color 0.3s, transform 0.1s;
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .start { background: #77d84a; color: #18300d; }
    .restart { background: #fff; color: #1c2e12; }
    
    .stage {
      position: relative;
      width: min(1280px, 100%);
      background: #24341d;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.08);
      touch-action: none; 
    }
    .win-restart {
      position: absolute;
      left: 50%;
      top: 79%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      background: linear-gradient(180deg, #ffe66d, #ffb703);
      color: #3a2600;
      border: 4px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 24px rgba(0,0,0,0.32);
      padding: 14px 34px;
      font-size: 1.15rem;
      border-radius: 999px;
    }
    .win-restart.show { display: block; }
    
    /* 商店與複習共用介面樣式 */
    .shop-modal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 35, 20, 0.95);
      border: 4px solid #78c952;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 580px;
      text-align: center;
      z-index: 20;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .shop-modal.show { display: block; }
    .shop-modal h2 { margin-top: 0; color: #ffd83d; }
    .shop-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .shop-btn {
      background: #2b4a24;
      color: #fff;
      border: 2px solid #4a803a;
      transition: background 0.2s;
    }
    .shop-btn:hover { background: #3a6331; }
    .shop-btn:disabled { background: #555; border-color: #444; color: #888; cursor: not-allowed; }
    .close-shop {
      background: #ffd83d;
      color: #3a2600;
      width: 100%;
      margin-top: 10px;
    }

    /* 角色選擇介面 */
    .character-modal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 18;
      background: rgba(10, 18, 8, 0.62);
      backdrop-filter: blur(3px);
    }
    .character-modal.show { display: flex; }
    .character-panel {
      width: min(760px, 92%);
      background: rgba(255, 255, 245, 0.97);
      color: #24431a;
      border: 6px solid #ffd83d;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 46px rgba(0,0,0,0.38);
      max-height: 90vh;
      overflow-y: auto;
    }
    .character-panel h2 { margin: 0 0 8px; font-size: 2rem; }
    .character-panel p { margin: 0 0 22px; font-weight: 700; color: #426834; }
    .character-options { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
    .character-card {
      width: 250px; min-height: 270px;
      background: #f8fff0; border: 4px solid #78c952;
      border-radius: 20px; padding: 14px 14px 18px;
      color: #24431a; box-shadow: 0 8px 20px rgba(0,0,0,0.16);
      transition: transform 0.16s, box-shadow 0.16s, border-color 0.16s;
      cursor: pointer;
    }
    .character-card:hover { transform: translateY(-4px); border-color: #ffb703; box-shadow: 0 12px 28px rgba(0,0,0,0.22); }
    .character-card img { height: 120px; max-width: 100%; object-fit: contain; display: block; margin: 0 auto 10px; }
    .character-card strong { display: block; font-size: 1.45rem; margin-bottom: 6px; }
    .character-card span { display: block; font-size: 0.95rem; line-height: 1.45; color: #4e6b42; }

    /* 手遊級虛擬按鍵 */
    .mobile-controls {
      display: flex; 
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      padding: 0 40px;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 15;
      pointer-events: none; 
    }
    .joystick-zone {
      width: 140px; height: 140px;
      background: rgba(255, 255, 255, 0.15);
      border: 4px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; position: relative; pointer-events: auto; backdrop-filter: blur(4px);
    }
    .joystick-knob {
      width: 65px; height: 65px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #a3c4f3);
      border-radius: 50%; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); box-shadow: 0 6px 14px rgba(0,0,0,0.4);
      pointer-events: none; transition: transform 0.05s ease-out; 
    }
    .joystick-zone.active .joystick-knob { transition: none; }

    .skill-zone { pointer-events: auto; }
    .skill-btn {
      width: 100px; height: 100px; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #ffeb3b 0%, #ff9800 40%, #e91e63 100%);
      border: 4px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.6), inset 0 0 15px rgba(255,255,255,0.5);
      color: #fff; display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; transition: transform 0.1s, box-shadow 0.1s;
    }
    .skill-btn:active { transform: scale(0.88); box-shadow: 0 0 10px rgba(255, 152, 0, 0.8); }
    .skill-icon { font-size: 45px; text-shadow: 0 4px 6px rgba(0,0,0,0.4); }

    .note { display: none; } 

    canvas { display: block; width: 100%; height: auto; background: linear-gradient(#7fc8d0, #c8dfaa 45%, #436e35 100%); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="hud">
        <div class="pill" id="scoreText">分數：0</div>
        <div class="pill" id="coinText">金幣：0</div>
        <div class="pill" id="timerText">時間：10:00</div>
        <div class="pill" id="lifeText">生命：3</div>
        <div class="pill" id="levelText">題目：1 / 30</div>
      </div>
      <div class="btns">
        <button class="start" id="startBtn">開始遊戲</button>
        <button class="restart" id="restartBtn">強制重置</button>
        <button class="restart" id="musicBtn">音樂：開</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="1280" height="820"></canvas>
      <button class="win-restart" id="winRestartBtn">查看錯題與結算</button>
      
      <div class="mobile-controls">
        <div class="joystick-zone" id="joystickZone">
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="skill-zone">
          <div class="skill-btn" id="mBtnJump">
            <div class="skill-icon">🚀</div>
          </div>
        </div>
      </div>

      <div id="shopModal" class="shop-modal">
        <h2>中場休息：健康補給站</h2>
        <p style="font-size:1.2rem;">累計持有金幣：<strong id="shopCoinsDisplay" style="color:#ffd83d;">0</strong></p>
        <div class="shop-items">
          <button class="shop-btn" id="buyHintBtn">購買：本題提示卡，屏閉一個錯誤選項 (2 金幣)</button>
          <button class="shop-btn" id="buyMealBtn">購買：高蛋白水煮餐，恢復 1 點生命 (2 金幣)</button>
          <button class="shop-btn" id="buyShieldBtn">購買：一次性防護罩 (2 金幣)</button>
          <button class="shop-btn" id="buyStarRingBtn">購買：星環旋轉特效 (3 金幣)</button>
          <button class="shop-btn" id="buySprintShoesBtn">購買：衝刺跑鞋 (4 金幣)</button>
          <button class="shop-btn" id="buyDoubleJumpBtn">購買：二段跳皮靴 (5 金幣)</button>
          <button class="shop-btn" id="buyTrailBtn">購買：炫彩殘影 (5 金幣)</button>
          <button class="shop-btn" id="buyMagnetBtn">購買：吸金石 (8 金幣)</button>
        </div>
        <button class="close-shop" id="closeShopBtn">離開商店，繼續挑戰</button>
      </div>

      <div id="reviewModal" class="shop-modal">
        <h2>錯題複習與結算</h2>
        <div id="reviewContent" style="max-height: 400px; overflow-y: auto; text-align: left; margin-bottom: 20px; padding-right: 5px;"></div>
        <button class="close-shop" id="closeReviewBtn">重新挑戰</button>
      </div>

      <div id="characterModal" class="character-modal show">
        <div class="character-panel">
          <h2>選擇你的健康角色</h2>
          <p>請先選擇角色，再按「開始遊戲」。</p>
          <div class="character-options">
            <button class="character-card" id="selectJayBtn" type="button">
              <img src="boy.png" alt="小傑">
              <strong>小傑</strong>
              <span>活力跑者，適合節奏快速的健康挑戰。</span>
            </button>
            <button class="character-card" id="selectNanaBtn" type="button">
              <img src="girl.png" alt="娜娜">
              <strong>娜娜</strong>
              <span>瑜珈女孩，沉著穩定地完成每一道題目。</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const coinText = document.getElementById('coinText');
    const timerText = document.getElementById('timerText');
    const lifeText = document.getElementById('lifeText');
    const levelText = document.getElementById('levelText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const musicBtn = document.getElementById('musicBtn');
    const winRestartBtn = document.getElementById('winRestartBtn');
    
    // 載入背景圖與角色圖
    const bgImage = new Image();
    bgImage.src = 'background.png';
    const boyImg = new Image();
    boyImg.src = 'boy.png';
    const girlImg = new Image();
    girlImg.src = 'girl.png';

    // 商店 DOM
    const shopModal = document.getElementById('shopModal');
    const shopCoinsDisplay = document.getElementById('shopCoinsDisplay');
    const buyStarRingBtn = document.getElementById('buyStarRingBtn');
    const buyShieldBtn = document.getElementById('buyShieldBtn');
    const buyHintBtn = document.getElementById('buyHintBtn');
    const buyMealBtn = document.getElementById('buyMealBtn');
    const buySprintShoesBtn = document.getElementById('buySprintShoesBtn');
    const buyTrailBtn = document.getElementById('buyTrailBtn'); 
    const buyDoubleJumpBtn = document.getElementById('buyDoubleJumpBtn');
    const buyMagnetBtn = document.getElementById('buyMagnetBtn');
    const closeShopBtn = document.getElementById('closeShopBtn');

    const reviewModal = document.getElementById('reviewModal');
    const reviewContent = document.getElementById('reviewContent');
    const closeReviewBtn = document.getElementById('closeReviewBtn');

    const characterModal = document.getElementById('characterModal');
    const selectJayBtn = document.getElementById('selectJayBtn');
    const selectNanaBtn = document.getElementById('selectNanaBtn');

    const W = canvas.width;
    const H = canvas.height;
    const keys = {};

    const BRICK_W = 46;
    const BRICK_H = 36;
    const BOX_W = 82;
    const BOX_H = 74;

    const groundY = 742;
    const gateY = 570;
    const upperPlatformY = 500;

    let gameCoins = 0;
    let selectedCharacter = 'Jay'; 
    let bestScore = Number(localStorage.getItem('healthGameBestScore') || 0);
    
    let hasSprintShoes = false, hasTrail = false, hasStarRing = false;
    let hasHint = false, hasDoubleJump = false, hasMagnet = false;
    
    // 結算與狀態追蹤
    let timeLeft = 600, lastTimestamp = 0;
    let hitWrongBoxes = new Set(); 
    let floatingTexts = []; 
    let mainCoinDrop = null; 
    let wrongHistory = []; 
    let hiddenWrongIdx = -1; // 儲存被提示卡屏閉的箱子索引
    
    let totalCollectedCoins = 0;
    let totalWrongDeductions = 0;
    let timeBonus = 0;

    // 下樓按鈕
    const teleportBtn = { x: 40, y: upperPlatformY - 20, w: 60, h: 20 };

    const player = {
      x: 610, y: groundY - 58,
      w: 38, h: 58,
      vx: 0, vy: 0,
      speed: 5.2, jump: 18.6,
      onGround: false, face: 1,
      hasShield: false, canDoubleJump: false
    };

    const originalLevels = [
      { question: '臺灣十大死因傳染病有愈來愈多的趨勢。', correct: 1, options: ['O 正確', 'X 錯誤'], explain: '慢性病有愈來愈多的趨勢。' },
      { question: '惡性腫瘤、心血管疾病、糖尿病等，是臺灣近年十大死因常出現的慢性病。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '這些都是近年常見的十大死因。' },
      { question: '慢性病成因與個人生活習慣有關，包括不良飲食、運動不足、抽菸喝酒等。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '生活習慣是慢性病的主要成因之一。' },
      { question: '只有生活習慣不佳的人，才會罹患慢性病。', correct: 1, options: ['O 正確', 'X 錯誤'], explain: '慢性病也有可能受到基因、年紀、環境等的影響。' },
      { question: '自民國71年起，癌症一直是臺灣十大死因冠軍。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '癌症長年位居臺灣十大死因之首。' },
      { question: '部分細胞不依生理需求及控制異常增長，就可能形成腫瘤。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '細胞異常增生是形成腫瘤的主因。' },
      { question: '癌症很難早期發現且治療無效，所以罹癌等於宣判死刑。', correct: 1, options: ['O 正確', 'X 錯誤'], explain: '癌症可以透過定期健康檢查早期發現、早期治療。' },
      { question: '全身器官都可能有癌細胞，所以要定期自我健康檢查。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '定期健檢能幫助及早發現異狀。' },
      { question: '爸爸的收縮壓130mmHg、舒張壓90mmHg，爸爸血壓異於標準值。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '正常血壓應小於120/80 mmHg，此數值偏高。' },
      { question: '糖尿病患體內細胞對胰島素的反應異常或無法分泌胰島素。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '這是糖尿病的主要致病機制。' },
      { question: '糖尿病可分為兩型，致病原因不同。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '第一型與第二型成因確實不同。' },
      { question: '第一型糖尿病是胰島素供應不足，病患多在老年時期發病。', correct: 1, options: ['O 正確', 'X 錯誤'], explain: '第一型糖尿病多在青少年時期發病。' },

      { question: '吃下了剛發芽的馬鈴薯造成輕微中毒是屬於天然毒素食品中毒。', correct: 0, options: ['O 正確', 'X 錯誤'], explain: '發芽馬鈴薯含有茄鹼，屬於天然毒素。' },

      { question: '衛生不佳的餐廳復業後再傳諾羅病毒感染是屬於細菌性食品中毒。', correct: 1, options: ['O 正確', 'X 錯誤'], explain: '諾羅病毒屬於「病毒性」食品中毒。' },
      { question: '以下有幾項可能是致癌因素？A.空氣汙染 B.油炸物 C.均衡飲食 D.經常酗酒', correct: 2, options: ['1 項', '2 項', '3 項', '4 項'], explain: '(甲)、(乙)、(丁) 共 3 項皆可能是致癌因素。' },
      { question: '下列有幾項為常見的癌症危險訊號？A.血便 B.乳房不正常硬塊 C.標準體重 D.久咳有血', correct: 2, options: ['1 項', '2 項', '3 項', '4 項'], explain: '(甲)、(乙)、(丁) 皆為癌症危險訊號。' },
      { question: '以下哪一項生活習慣可能無法預防癌症？', correct: 0, options: ['睡前吃宵夜', '定期健康檢查', '均衡飲食', '規律作息'], explain: '睡前吃宵夜對腸胃負擔大，並非預防癌症的習慣。' },
      { question: '請問以下哪一項不屬於「三高」食物？', correct: 1, options: ['高鹽', '高纖', '高糖', '高脂'], explain: '「三高」指的是高鹽、高糖、高脂，不包含高纖。' },

      { question: '腦中風可運用FAST原則檢測，何項說明錯誤？', correct: 2, options: ['F是Face', 'A是Arm', 'S是Speed', 'T是Time'], explain: 'S應為Speech (說話口齒不清)。' },

    let levels = []; 

    let running = false, finished = false, currentLevel = 0;

    let lastShopLevel = -1, currentCombo = 0, extraCoins = [];    

    const wrongBoxShake = {}, particles = [], trailParticles = [], hazards = [];
    let hazardSpawnTimer = 0;
    const HAZARD_TYPES = [
      { name: '炸雞', color: '#ff9d00', emoji: '🍗' },
      { name: '珍奶', color: '#8b4513', emoji: '🧋' },
      { name: '甜甜圈', color: '#ff69b4', emoji: '🍩' }
    ];

    let audioCtx = null;
    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.08) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playJumpSound() { playTone(260, 0.07, 'square', 0.045); }
    function playWrongSound() { playTone(140, 0.12, 'sawtooth', 0.06); }
    function playCorrectSound() { playTone(520, 0.08, 'sine', 0.06); setTimeout(() => playTone(760, 0.08, 'sine', 0.055), 70); }
    function playCoinSound() { playTone(880, 0.07, 'triangle', 0.06); setTimeout(() => playTone(1180, 0.08, 'triangle', 0.055), 60); }

    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const mBtnJump = document.getElementById('mBtnJump');
    
    let joyActive = false;
    let joyCenterX = 0, joyCenterY = 0;
    const maxJoyRadius = 40; 

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      joyActive = true;
      joystickZone.classList.add('active'); 
      const rect = joystickZone.getBoundingClientRect();
      joyCenterX = rect.left + rect.width / 2;
      joyCenterY = rect.top + rect.height / 2;
      updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    joystickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!joyActive) return;
      updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    function resetJoystick(e) {
      if(e) e.preventDefault();
      joyActive = false;
      joystickZone.classList.remove('active');
      joystickKnob.style.transform = `translate(-50%, -50%)`; 
      keys['ArrowLeft'] = false;
      keys['ArrowRight'] = false;
    }

    joystickZone.addEventListener('touchend', resetJoystick);
    joystickZone.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(clientX, clientY) {
      let dx = clientX - joyCenterX;
      let dy = clientY - joyCenterY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance > maxJoyRadius) {
        dx = dx * (maxJoyRadius / distance);
        dy = dy * (maxJoyRadius / distance);
      }
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

      const threshold = 12;
      if (dx > threshold) {
        keys['ArrowRight'] = true; keys['ArrowLeft'] = false;
      } else if (dx < -threshold) {
        keys['ArrowLeft'] = true; keys['ArrowRight'] = false;
      } else {
        keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
      }
    }

    mBtnJump.addEventListener('touchstart', (e) => {
      e.preventDefault(); jump(); 
    }, { passive: false });

    selectJayBtn.addEventListener('click', () => { selectedCharacter = 'Jay'; characterModal.classList.remove('show'); });
    selectNanaBtn.addEventListener('click', () => { selectedCharacter = 'Nana'; characterModal.classList.remove('show'); });

    function shuffleLevels() {
      let tfArr = originalLevels.slice(0, 18).sort(() => Math.random() - 0.5);
      let mcArr = originalLevels.slice(18).sort(() => Math.random() - 0.5);
      levels = tfArr.concat(mcArr).map((item, index) => {
        let textParts = item.question.split('：');
        let newQuestion = `第 ${index + 1} 題：${textParts.length > 1 ? textParts.slice(1).join('：') : item.question}`;
        return { ...item, question: newQuestion, originalQ: item.question };
      });
    }

    function answerBoxes() {
      if (levels.length === 0 || currentLevel >= levels.length) return []; 
      const opts = levels[currentLevel].options;
      const gap = 142;
      const totalWidth = opts.length * BOX_W + (opts.length - 1) * gap;
      const startX = (W - totalWidth) / 2; 
      
      return opts.map((text, i) => ({
        x: startX + i * (BOX_W + gap), y: gateY - 18, w: BOX_W, h: BOX_H,
        text, idx: i, 
        // 加入 hiddenWrongIdx 邏輯，若是被提示卡屏閉的選項，則設定為 removed 隱藏起來
        removed: (gateOpened && i === levels[currentLevel].correct) || (i === hiddenWrongIdx)
      }));
    }

    function startGame() {
      if (characterModal.classList.contains('show')) characterModal.classList.remove('show');
      winRestartBtn.classList.remove('show'); shopModal.classList.remove('show'); reviewModal.classList.remove('show');
      
      shuffleLevels(); 
      
      running = true; finished = false; currentLevel = 0; score = 0; lives = 3;
      gameCoins = 0; hasSprintShoes = false; hasTrail = false; hasStarRing = false; hasHint = false;
      hasDoubleJump = false; hasMagnet = false;
      player.speed = 5.2; player.hasShield = false; player.canDoubleJump = false;
      currentCombo = 0; extraCoins = []; mainCoinDrop = null;
      
      timeLeft = 600; lastTimestamp = performance.now();
      totalCollectedCoins = 0; totalWrongDeductions = 0; timeBonus = 0;
      
      gateOpened = false; transitionTimer = 0; coinVisible = false; coinCollected = false;
      attempts = 0; correctAnswers = 0; wrongAnswers = 0; lastShopLevel = -1;
      particles.length = 0; trailParticles.length = 0; hazards.length = 0; hazardSpawnTimer = 0;
      floatingTexts = []; hitWrongBoxes.clear(); wrongHistory = []; hiddenWrongIdx = -1;
      
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      setPlayerToGround(); setPopup('頂到正確答案箱，箱子會消失並開通往上一層的路。', 180); updateHud();

    }

    function updateHud() {
      scoreText.textContent = `分數：${score}`;

      lifeText.textContent = `生命：${lives}`; 
      levelText.textContent = `題目：${Math.min(currentLevel + 1, levels.length || 30)} / ${levels.length || 30}`;
      
      let m = Math.floor(timeLeft / 60);
      let s = Math.floor(timeLeft % 60);
      timerText.textContent = `時間：${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;

    function setPopup(text, frames = 120) { popup = text; popupTimer = frames; }

    function jump() {

      if (player.onGround) { 
        player.vy = -player.jump; player.onGround = false; 
        if(hasDoubleJump) player.canDoubleJump = true;

      } else if (hasDoubleJump && player.canDoubleJump) {
        player.vy = -player.jump * 0.9;

        playJumpSound();
        spawnParticles(player.x + player.w/2, player.y + player.h, '#fff', 10);
      }

      gateOpened = true; coinVisible = true; coinCollected = false; attempts += 1; correctAnswers += 1;
      
      score += 3; 
      currentCombo += 1; 
      
      floatingTexts.push({x: box.x + box.w/2, y: box.y - 20, text: "+3", color: "#89ff4d", life: 60});

    function coinRect() { return { x: 610, y: upperPlatformY - 62, w: 46, h: 46 }; }

    function spawnExtraCoins(count) {

        extraCoins.push({
          x: startX, y: startY, w: 46, h: 46,

    function checkAllCoinsCollected() {

    function collectCoin() {

    function triggerWrongBoxFeedback(box) {
      wrongBoxShake[box.idx] = 24;

      playWrongSound(); 
      setPopup('這不是正確答案，請再試一次。', 55);

      if (!hitWrongBoxes.has(box.idx)) {
        score -= 1;
        totalWrongDeductions += 1;

        floatingTexts.push({x: box.x + box.w/2, y: box.y - 20, text: "-1", color: "#ff4444", life: 60});
        updateHud();

        let currentQ = levels[currentLevel];
        if (!wrongHistory.some(q => q.originalQ === currentQ.originalQ)) {
          wrongHistory.push(currentQ);
        }
      }
    }

    function updateWrongBoxShake() {
      for (const key of Object.keys(wrongBoxShake)) {
        wrongBoxShake[key] -= 1; if (wrongBoxShake[key] <= 0) delete wrongBoxShake[key];
      }
    }

    function spawnParticles(x, y, color = '#ffd83d', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2; const speed = 1.5 + Math.random() * 4.2;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.8, life: 38 + Math.random() * 22, size: 3 + Math.random() * 5, color });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateFloatingTexts() {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1; 
        ft.life -= 1;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function updateTrailParticles() {
      if (hasTrail && running && !finished && (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5)) {
        for(let i = 0; i < 2; i++) {
          trailParticles.push({
            x: player.x + player.w / 2 + (Math.random() - 0.5) * 20, y: player.y + player.h / 2 + (Math.random() - 0.5) * 20 + 10,
            life: 25, maxLife: 25, color: `hsl(${(Date.now() / 8) % 360}, 100%, 65%)`, size: 5 + Math.random() * 6
          });
        }
      }
      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i]; p.life--; p.y -= 0.3; p.size *= 0.92; 
        if (p.life <= 0) trailParticles.splice(i, 1);
      }
    }

    function updateHazards() {
      if (currentLevel < 2 || !running || finished || transitionTimer > 0) return;
      hazardSpawnTimer--;
      if (hazardSpawnTimer <= 0) {
        hazards.push({ x: Math.random() * (W - 40), y: -50, w: 45, h: 45, vy: 2 + Math.random() * 3, type: HAZARD_TYPES[Math.floor(Math.random() * HAZARD_TYPES.length)] });
        hazardSpawnTimer = 100 + Math.random() * 80;
      }
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i]; h.y += h.vy;
        if (rectsIntersect(player, h)) {
          hazards.splice(i, 1);
          if (player.hasShield) {
            player.hasShield = false; playCorrectSound(); setPopup(`防護罩成功抵擋了 ${h.type.name}！`, 60);
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#64c8ff', 20); continue;
          }
          lives -= 1; playWrongSound(); setPopup(`哎呀！被${h.type.name}砸中了，生命值 -1！`, 60);
          spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 10); updateHud();
          if (lives <= 0) { 
            finished = true; timeBonus = 0; 
            winRestartBtn.classList.add('show'); resetJoystick(); 
          }
          continue;
        }
        if (h.y > H) hazards.splice(i, 1);
      }
    }

    function nextLevel() {
      currentLevel += 1;
      if (currentLevel >= levels.length) {
        finished = true; 
        if (timeLeft > 0 && lives > 0) {

        bestScore = Math.max(bestScore, score); localStorage.setItem('healthGameBestScore', String(bestScore));

      }
      resumeNextLevelSetup();

      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);

        let wrongIndices = [];
        for (let i = 0; i < levels[currentLevel].options.length; i++) {
          if (i !== levels[currentLevel].correct) wrongIndices.push(i);
        }
        if (wrongIndices.length > 0) {
          hiddenWrongIdx = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
        }
        hasHint = false; // 消耗提示卡
      } else {
        hiddenWrongIdx = -1; // 沒有提示卡則全顯示
      }

      setPlayerToGround(); setPopup('進入下一題。請碰撞出正確答案。', 150); updateHud();
    }

          <div style="background: rgba(255,255,255,0.1); padding: 12px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid #ff4444;">
            <div style="color: #ffb703; margin-bottom: 6px; font-weight:bold; font-size:1.1rem;">${q.question}</div>
            <div style="color: #fff; margin-bottom: 4px;">✔ 正確答案：<span style="color:#89ff4d;">${q.options[q.correct]}</span></div>
            <div style="color: #a3c4f3; font-size: 0.95rem;">💡 解析：${q.explain}</div>
          </div>
        `).join('');
      }
      reviewModal.classList.add('show');
    }

    winRestartBtn.addEventListener('click', () => {
      if (finished) {
        winRestartBtn.classList.remove('show');
        showReviewModal();
      } else {
        startGame();
      }
    });

    closeReviewBtn.addEventListener('click', () => {
      reviewModal.classList.remove('show');
      startGame();
    });

    function rectsIntersect(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

    function getBarrierRects() {
      if (levels.length === 0 || currentLevel >= levels.length) return [];
      const rects = [], boxes = answerBoxes(), correctIdx = levels[currentLevel].correct;
      // 只有當門打開，或是箱子被屏閉時，該空間才會變成可穿透的 openGap
      const openGap = gateOpened ? { x: boxes[correctIdx].x - 8, y: gateY - 6, w: boxes[correctIdx].w + 16, h: BOX_H + 24 } : null;
      for (const box of boxes) { if (!box.removed) rects.push({ ...box, type: box.idx === correctIdx ? 'correctBox' : 'wrongBox' }); }
      for (let x = 0; x < W; x += BRICK_W) { const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H, type: 'brick' }; const insideOpenedGap = openGap && rectsIntersect(brick, openGap); if (!insideOpenedGap) rects.push(brick); }
      return rects;
    }

    function resolveBarrierCollision(prev) {
      const solids = getBarrierRects();
      for (const solid of solids) {
        if (!rectsIntersect(player, solid)) continue;
        const prevBottom = prev.y + player.h, prevTop = prev.y, prevRight = prev.x + player.w, prevLeft = prev.x;
        
        if (prevTop >= solid.y + solid.h - 8 && player.vy < 0) {
          player.y = solid.y + solid.h + 0.5;
          if (solid.type === 'correctBox' && !gateOpened) { openGate(solid); } 
          else { if (solid.type === 'wrongBox') triggerWrongBoxFeedback(solid); player.vy = 2.8; }
        } else if (prevBottom <= solid.y + 8 && player.vy >= 0) {
          player.y = solid.y - player.h; player.vy = 0; player.onGround = true; 
        }

        if (prevRight <= solid.x + 8) { player.x = solid.x - player.w; player.vx = 0; } 
        else if (prevLeft >= solid.x + solid.w - 8) { player.x = solid.x + solid.w; player.vx = 0; }
      }
    }

    function applyMagnet(c) {
      if (!hasMagnet || c.collected) return false;
      let px = player.x + player.w / 2;
      let py = player.y + player.h / 2;
      let cx = c.x + c.w / 2;
      let cy = c.y + c.h / 2;
      
      let speed = 6; 
      let dist = Math.sqrt(Math.pow(px - cx, 2) + Math.pow(py - cy, 2));
      if (dist > 0) {
        c.vx = (px - cx) / dist * speed;
        c.vy = (py - cy) / dist * speed;
        c.landed = false; 
        c.magnetized = true; 
        return true;
      }
      return false;
    }

    function updateCoinsPhysics() {
      if (coinVisible && mainCoinDrop) {
        let isMag = applyMagnet(mainCoinDrop);
        if (isMag) {
          mainCoinDrop.x += mainCoinDrop.vx; mainCoinDrop.y += mainCoinDrop.vy;
        } else if (!mainCoinDrop.landed) {
          mainCoinDrop.vy += 0.5; mainCoinDrop.x += mainCoinDrop.vx; mainCoinDrop.y += mainCoinDrop.vy;
          if (mainCoinDrop.x < 0) { mainCoinDrop.x = 0; mainCoinDrop.vx *= -0.6; } if (mainCoinDrop.x + mainCoinDrop.w > W) { mainCoinDrop.x = W - mainCoinDrop.w; mainCoinDrop.vx *= -0.6; }
          if (mainCoinDrop.y + mainCoinDrop.h >= upperPlatformY) { mainCoinDrop.y = upperPlatformY - mainCoinDrop.h; mainCoinDrop.vy *= -0.5; mainCoinDrop.vx *= 0.8; if (Math.abs(mainCoinDrop.vy) < 1.5) { mainCoinDrop.vy = 0; mainCoinDrop.vx = 0; mainCoinDrop.landed = true; } }
        }
        if (rectsIntersect(player, mainCoinDrop)) collectCoin();
      }

      for (let i = extraCoins.length - 1; i >= 0; i--) {
        let c = extraCoins[i];
        let isMag = applyMagnet(c);
        if (isMag) {
          c.x += c.vx; c.y += c.vy;
        } else if (!c.landed) {
          c.vy += 0.5; c.x += c.vx; c.y += c.vy;
          if (c.x < 0) { c.x = 0; c.vx *= -0.6; } if (c.x + c.w > W) { c.x = W - c.w; c.vx *= -0.6; }
          if (c.y + c.h >= c.targetY) { c.y = c.targetY - c.h; c.vy *= -0.5; c.vx *= 0.8; if (Math.abs(c.vy) < 1.5) { c.vy = 0; c.vx = 0; c.landed = true; } }
        }
        
        if (rectsIntersect(player, c)) {
          score += 5; gameCoins += 1; totalCollectedCoins += 1; updateHud(); playCoinSound();
          spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd83d', 26);
          extraCoins.splice(i, 1); 
          if (transitionTimer === 0) checkAllCoinsCollected(); 
        }
      }
    }

    function update() {
      let now = performance.now();
      let dt = (now - lastTimestamp) / 1000;
      lastTimestamp = now;

      if (!running) { if (popupTimer > 0) popupTimer--; return; }
      if (finished) { if (popupTimer > 0) popupTimer--; return; }

      if (transitionTimer === 0) {
        timeLeft -= dt;
        if(timeLeft < 0) timeLeft = 0; 
        updateHud();
      }

      if (transitionTimer > 0) {
        transitionTimer--; updateWrongBoxShake(); updateParticles(); updateTrailParticles(); updateFloatingTexts();
        
        if (keys.ArrowLeft || keys.a || keys.A) { player.vx = -player.speed; player.face = -1; } 
        else if (keys.ArrowRight || keys.d || keys.D) { player.vx = player.speed; player.face = 1; } 
        else { player.vx *= 0.76; if (Math.abs(player.vx) < 0.12) player.vx = 0; }
        
        player.x += player.vx; if (player.x < 0) player.x = 0; if (player.x + player.w > W) player.x = W - player.w;

        updateCoinsPhysics();

        if (transitionTimer === 0) nextLevel();
        return;
      }

      if (keys.ArrowLeft || keys.a || keys.A) { player.vx = -player.speed; player.face = -1; } 
      else if (keys.ArrowRight || keys.d || keys.D) { player.vx = player.speed; player.face = 1; } 
      else { player.vx *= 0.76; if (Math.abs(player.vx) < 0.12) player.vx = 0; }

      player.vy += 0.58; if (player.vy > 14) player.vy = 14;
      const prev = { x: player.x, y: player.y }, prevBottom = player.y + player.h;
      player.x += player.vx; player.y += player.vy;
      if (player.x < 0) player.x = 0; if (player.x + player.w > W) player.x = W - player.w;
      player.onGround = false;

      let teleported = false;
      if (player.vy >= 0 && rectsIntersect(player, teleportBtn)) {
        setPlayerToGround();
        setPopup('已傳送回底層！', 60);
        teleported = true;
      } else if (prevBottom <= groundY && player.y + player.h >= groundY) { 
        player.y = groundY - player.h; player.vy = 0; player.onGround = true; 
      }

      resolveBarrierCollision(prev);
      if (!teleported && gateOpened && prevBottom <= upperPlatformY && player.y + player.h >= upperPlatformY) { 
        player.y = upperPlatformY - player.h; player.vy = 0; player.onGround = true; 
      }
      
      updateCoinsPhysics();

      if (popupTimer > 0) popupTimer--;
      updateWrongBoxShake(); updateParticles(); updateTrailParticles(); updateFloatingTexts(); updateHazards(); 
    }

    function drawBackground() {
      if (bgImage.complete && bgImage.naturalWidth > 0) {
        ctx.drawImage(bgImage, 0, 0, W, H);
      } else {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, '#73cdd7'); gradient.addColorStop(1, '#334c25');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, W, H);
      }
    }

    function drawVersionLabel() {
      ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.82)'; ctx.font = 'bold 16px "Microsoft JhengHei"'; ctx.textAlign = 'right'; ctx.fillText('v5.6 提示卡修復與人物圖片支援版', W - 24, 32); ctx.restore();
    }

    function drawQuestion() {
      if (levels.length === 0) return;
      const lv = levels[currentLevel] || levels[levels.length - 1];
      ctx.save(); ctx.font = 'bold 30px "Microsoft JhengHei"'; ctx.textAlign = 'left'; ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(22,36,16,0.78)'; ctx.strokeText(lv.question, 70, 80); ctx.fillStyle = '#fff'; ctx.fillText(lv.question, 70, 80); ctx.restore();
    }

    function drawBrick(x, y, w = BRICK_W, h = BRICK_H) {
      ctx.fillStyle = '#7b3d1f'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#a2532b'; ctx.fillRect(x + 3, y + 3, w - 6, h - 6); ctx.strokeStyle = '#4c230f'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x + 5, y + 5, w - 10, 5);
    }

    function drawBrickLineExceptGate() {
      if (levels.length === 0 || currentLevel >= levels.length) { 
        for (let x = 0; x < W; x += BRICK_W) drawBrick(x, gateY, BRICK_W, BRICK_H); 
        return; 
      }
      const boxes = answerBoxes(), correctIdx = levels[currentLevel].correct;
      const openGap = gateOpened ? { x: boxes[correctIdx].x - 8, y: gateY - 6, w: boxes[correctIdx].w + 16, h: BOX_H + 24 } : null;
      for (let x = 0; x < W; x += BRICK_W) { const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H }; const insideOpenedGap = openGap && rectsIntersect(brick, openGap); if (!insideOpenedGap) drawBrick(x, gateY, BRICK_W, BRICK_H); }
    }

    function drawUpperPlatform() { 
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, upperPlatformY, BRICK_W, BRICK_H); 
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, upperPlatformY - 3, W, 3); 
      
      ctx.fillStyle = '#e53935';
      ctx.fillRect(teleportBtn.x, teleportBtn.y, teleportBtn.w, teleportBtn.h);
      ctx.fillStyle = '#ffcdd2';
      ctx.fillRect(teleportBtn.x+2, teleportBtn.y+2, teleportBtn.w-4, teleportBtn.h-4);
      ctx.fillStyle = '#b71c1c';
      ctx.font = 'bold 13px "Microsoft JhengHei"';
      ctx.textAlign = 'center';
      ctx.fillText('下樓', teleportBtn.x + teleportBtn.w/2, teleportBtn.y + 15);
    }
    
    function drawGroundPlatform() { for (let x = 0; x < W; x += BRICK_W) drawBrick(x, groundY, BRICK_W, BRICK_H); }

    function drawAnswerBox(box) {
      if (box.removed) return;
      const shakeFrames = wrongBoxShake[box.idx] || 0, shakeOffset = shakeFrames > 0 ? Math.sin(shakeFrames * 1.15) * 8 : 0, yBump = shakeFrames > 0 ? Math.sin(shakeFrames * 0.8) * 2 : 0, drawX = box.x + shakeOffset, drawY = box.y + yBump;
      ctx.save();
      if (shakeFrames > 0) { ctx.shadowColor = 'rgba(255, 40, 40, 0.65)'; ctx.shadowBlur = 14; }
      ctx.fillStyle = '#5bc92f'; ctx.fillRect(drawX, drawY, box.w, box.h); ctx.fillStyle = shakeFrames > 0 ? '#7df047' : '#83ee4b'; ctx.fillRect(drawX + 5, drawY + 5, box.w - 10, box.h - 10); ctx.strokeStyle = shakeFrames > 0 ? '#d62828' : '#2e7019'; ctx.lineWidth = 4; ctx.strokeRect(drawX, drawY, box.w, box.h); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(drawX + 10, drawY + 10, box.w - 20, 12); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 19px "Microsoft JhengHei"'; wrapCenter(box.text, drawX + box.w / 2, drawY + 36, box.w - 10, 21);
      ctx.restore();
    }

    function drawCoinItem(c) {
      const pulse = Math.sin(Date.now() / 120) * 3, size = c.w + pulse, cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      ctx.save(); ctx.fillStyle = '#ffd83d'; ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#b56b00'; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = '#fff4a3'; ctx.beginPath(); ctx.arc(cx - 9, cy - 10, 7, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#e19a00'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, size / 2 - 10, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = '#d98400'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.fillText('$', cx, cy + 8); ctx.restore();
    }
    function drawCoin() { 
      if (coinVisible && mainCoinDrop) drawCoinItem(mainCoinDrop); 
      extraCoins.forEach(drawCoinItem); 
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) { ctx.globalAlpha = Math.max(p.life / 55, 0); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1; ctx.restore();
    }
    
    function drawFloatingTexts() {
      ctx.save();
      for (const ft of floatingTexts) {
        ctx.globalAlpha = Math.max(0, ft.life / 60);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.restore();
    }

    function drawTrailParticles() {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const p of trailParticles) { ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }

    function drawHazards() {
      hazards.forEach(h => {
        ctx.save(); ctx.fillStyle = h.type.color; ctx.beginPath(); ctx.arc(h.x + h.w/2, h.y + h.h/2, h.w/2, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(h.type.emoji, h.x + h.w/2, h.y + h.h/2 + 3); ctx.restore();
      });
    }

    function wrapCenter(text, x, y, maxWidth, lineHeight) {
      const chars = [...text]; let line = ''; const lines = [];
      for (const ch of chars) { const test = line + ch; if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = ch; } else line = test; }
      if (line) lines.push(line); lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    }

    function drawSingleStar(x, y, isFront) {
      ctx.save(); ctx.globalAlpha = isFront ? 1 : 0.5; ctx.beginPath(); ctx.arc(x, y, isFront ? 4 : 3, 0, Math.PI * 2); ctx.fillStyle = '#ffb703'; ctx.shadowBlur = 8; ctx.shadowColor = '#ffe66d'; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, isFront ? 2 : 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0; ctx.fill(); ctx.restore();
    }

    function drawPlayer() {
      ctx.save(); ctx.translate(player.x, player.y);
      const time = Date.now() / 400, numStars = 3, radiusX = 35, radiusY = 12;

      if (hasStarRing) {
        for (let i = 0; i < numStars; i++) { const angle = time + (i * Math.PI * 2 / numStars); if (Math.sin(angle) <= 0) { drawSingleStar(19 + Math.cos(angle) * radiusX, 34 + Math.sin(angle) * radiusY, false); } }
      }

      if (player.hasShield) {
        const pulse = Math.sin(Date.now() / 150) * 2; ctx.beginPath(); ctx.arc(19, 29, 36 + pulse, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = 'rgba(100, 200, 255, 0.2)'; ctx.fill();
      }

      let imgToDraw = selectedCharacter === 'Nana' ? girlImg : boyImg;
      if (imgToDraw.complete && imgToDraw.naturalWidth > 0) {
        if (player.face === -1) {
          ctx.scale(-1, 1);
          ctx.drawImage(imgToDraw, -player.w, 0, player.w, player.h);
          ctx.scale(-1, 1); 
        } else {
          ctx.drawImage(imgToDraw, 0, 0, player.w, player.h);
        }
      } else {
        const mainColor = selectedCharacter === 'Nana' ? '#e91e63' : '#d93228';
        const pantsColor = selectedCharacter === 'Nana' ? '#673ab7' : '#244f9a';
        ctx.fillStyle = mainColor; ctx.beginPath(); ctx.ellipse(19, 13, 17, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffe0c2'; ctx.beginPath(); ctx.arc(21, 25, 12, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = pantsColor; ctx.fillRect(8, 34, 26, 18); ctx.fillRect(6, 50, 10, 8); ctx.fillRect(24, 50, 10, 8); ctx.fillStyle = '#6a3a1f'; ctx.fillRect(7, 56, 12, 4); ctx.fillRect(23, 56, 12, 4); ctx.fillStyle = '#fff'; ctx.fillRect(player.face === 1 ? 25 : 15, 23, 3, 3);
      }
      
      if (hasStarRing) {
        for (let i = 0; i < numStars; i++) { const angle = time + (i * Math.PI * 2 / numStars); if (Math.sin(angle) > 0) { drawSingleStar(19 + Math.cos(angle) * radiusX, 34 + Math.sin(angle) * radiusY, true); } }
      }
      ctx.restore();
    }

    function drawPopup() {
      if (!popup || popupTimer <= 0) return;
      ctx.save(); ctx.globalAlpha = Math.min(1, popupTimer / 20); ctx.fillStyle = 'rgba(20,28,18,0.74)'; ctx.fillRect(150, 110, 980, 62); ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.strokeRect(150, 110, 980, 62); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 24px "Microsoft JhengHei"'; ctx.fillText(popup, W / 2, 150); ctx.restore();
    }

    function drawOverlay() {
      if (running && !finished) return;
      ctx.save();
      if (finished) {
        ctx.fillStyle = 'rgba(7, 18, 8, 0.85)'; ctx.fillRect(0, 0, W, H); 
        ctx.fillStyle = 'rgba(255, 255, 245, 0.97)'; ctx.fillRect(210, 100, 860, 580); 
        ctx.strokeStyle = '#ffd83d'; ctx.lineWidth = 8; ctx.strokeRect(210, 100, 860, 580); 
        ctx.fillStyle = '#24431a'; ctx.textAlign = 'center'; 
        
        ctx.font = 'bold 48px "Microsoft JhengHei"'; 
        ctx.fillText(lives > 0 ? '恭喜！通關完成' : '體力耗盡，遊戲結束', W / 2, 180); 
        
        ctx.font = '26px "Microsoft JhengHei"'; 
        ctx.fillText(`答對 ${correctAnswers} 題： +${correctAnswers * 3} 分`, W / 2, 260);
        ctx.fillText(`收集 ${totalCollectedCoins} 枚金幣： +${totalCollectedCoins * 5} 分`, W / 2, 310);
        ctx.fillText(`答錯 ${totalWrongDeductions} 次： -${totalWrongDeductions} 分`, W / 2, 360);
        ctx.fillText(`時間剩餘 ${Math.floor(timeLeft)} 秒： +${timeBonus} 分`, W / 2, 410);
        
        ctx.font = 'bold 36px "Microsoft JhengHei"';
        ctx.fillStyle = '#e91e63';
        ctx.fillText(`最終結算總分：${score}`, W / 2, 480);
        
        ctx.font = '22px "Microsoft JhengHei"'; 
        ctx.fillStyle = '#24431a';
        ctx.fillText('點擊下方按鈕進行錯題複習，或重新開始', W / 2, 560); 
        ctx.restore(); return;
      }
      ctx.fillStyle = 'rgba(10,16,8,0.52)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fillRect(260, 255, 760, 230); ctx.strokeStyle = '#78c952'; ctx.lineWidth = 5; ctx.strokeRect(260, 255, 760, 230); ctx.fillStyle = '#24431a'; ctx.textAlign = 'center'; ctx.font = 'bold 40px "Microsoft JhengHei"'; ctx.fillText(finished ? '遊戲結束' : '跳跳跳健康問答', W / 2, 330); ctx.font = '24px "Microsoft JhengHei"'; ctx.fillText(finished ? `最終分數：${score}` : '碰撞正確答案，消除箱子並跳上下一層', W / 2, 378); ctx.fillText(finished ? '點擊下方按鈕進行錯題複習' : '按上方「開始遊戲」開始', W / 2, 420); ctx.restore();
    }

    function draw() {
      drawBackground(); drawVersionLabel(); drawQuestion(); drawUpperPlatform(); drawBrickLineExceptGate(); answerBoxes().forEach(drawAnswerBox); drawUpperPlatform(); drawCoin(); drawParticles(); drawTrailParticles(); drawFloatingTexts(); drawHazards(); drawGroundPlatform(); if (running) drawPlayer(); drawPopup(); drawOverlay();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    document.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp', ' ', 'w', 'W'].includes(e.key)) { e.preventDefault(); jump(); } });
    document.addEventListener('keyup', e => { keys[e.key] = false; });
    startBtn.addEventListener('click', startGame); restartBtn.addEventListener('click', startGame);
    
    shuffleLevels();
    updateHud(); 
    loop();
  </script>
